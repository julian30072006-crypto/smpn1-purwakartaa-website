<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Aesthetic Website</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 1000px;
    padding: 40px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    text-align: center;
}

h1 {
    font-size: 3rem;
    font-weight: 700;
    background: linear-gradient(90deg, #00f5ff, #ff00c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    margin-top: 20px;
    font-size: 1.1rem;
    opacity: 0.9;
}

.button {
    margin-top: 30px;
    padding: 12px 30px;
    border-radius: 30px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    color: white;
    background: linear-gradient(90deg, #00f5ff, #ff00c8);
    transition: 0.3s ease;
}

.button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #00f5ff;
}

footer {
    margin-top: 40px;
    font-size: 0.9rem;
    opacity: 0.7;
}

@media(max-width:768px){
    h1 {
        font-size: 2rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Modern Aesthetic</h1>
    <p>Website dengan tampilan modern, clean, dan elegan.<br>
    Dibuat dengan gaya glassmorphism dan gradient masa kini.</p>

    <button class="button">Explore</button>

    <footer>
        ✨ Creator Julian ✨
    </footer>
</div>

</body>
</html>
