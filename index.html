<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>GEM UNO – Modern (Fixed)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
display:flex;justify-content:center;align-items:center;
color:white
}
.game{
width:95%;max-width:1100px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(14px);
border-radius:28px;
padding:30px;
box-shadow:0 25px 70px rgba(0,0,0,.6)
}
h1{text-align:center;color:#ffd369}
.layout{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
margin-top:25px
}
.panel{
background:rgba(255,255,255,.07);
border-radius:20px;
padding:20px;
text-align:center
}
.hand{
display:flex;
flex-wrap:wrap;
justify-content:center
}
.card{
width:70px;height:105px;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
font-weight:600;
margin:6px;
cursor:pointer;
transition:.25s;
box-shadow:0 10px 25px rgba(0,0,0,.4)
}
.card:hover{
transform:translateY(-6px) scale(1.08)
}
.red{background:#e63946}
.blue{background:#457b9d}
.green{background:#2a9d8f}
.yellow{background:#f4a261;color:black}
.deck{
margin-top:15px;
padding:18px;
border-radius:18px;
background:#222;
cursor:pointer
}
.deck:hover{
box-shadow:0 0 20px rgba(255,255,255,.4)
}
.info{
margin-top:15px;
text-align:center;
min-height:24px
}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="game">
<h1>🎴 GEM UNO</h1>

<div class="layout">
    <div class="panel">
        <h3>🤖 BOT</h3>
        <p>Kartu: <span id="botCount"></span></p>
    </div>

    <div class="panel">
        <h3>Kartu Teratas</h3>
        <div id="topCard"></div>
        <div class="deck" onclick="drawCard()">Ambil Kartu</div>
    </div>

    <div class="panel">
        <h3>🧑 PLAYER</h3>
        <div id="playerCards" class="hand"></div>
    </div>
</div>

<div class="info" id="info"></div>
</div>

<script>
const colors=["red","blue","green","yellow"];
let deck=[],player=[],bot=[],topCard=null,turn="player";

function buildDeck(){
deck=[];
colors.forEach(c=>{
for(let i=0;i<=9;i++){
deck.push({c,v:i});
deck.push({c,v:i});
}
});
}

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
}

function startGame(){
buildDeck();
shuffle(deck);
player=deck.splice(0,7);
bot=deck.splice(0,7);
topCard=deck.pop();
turn="player";
updateUI();
}

function drawCard(){
if(turn!=="player") return;
player.push(deck.pop());
turn="bot";
updateUI();
setTimeout(botPlay,800);
}

function playCard(i){
if(turn!=="player") return;
let c=player[i];
if(c.c===topCard.c || c.v===topCard.v){
topCard=c;
player.splice(i,1);
turn="bot";
updateUI();
checkWin();
setTimeout(botPlay,800);
}else{
showInfo("❌ Kartu tidak cocok");
}
}

function botPlay(){
if(turn!=="bot") return;
for(let i=0;i<bot.length;i++){
let c=bot[i];
if(c.c===topCard.c || c.v===topCard.v){
topCard=c;
bot.splice(i,1);
turn="player";
updateUI();
checkWin();
return;
}
}
bot.push(deck.pop());
turn="player";
updateUI();
}

function updateUI(){
const p=document.getElementById("playerCards");
p.innerHTML="";
player.forEach((x,i)=>{
let d=document.createElement("div");
d.className=`card ${x.c}`;
d.textContent=x.v;
d.onclick=()=>playCard(i);
p.appendChild(d);
});

document.getElementById("topCard").innerHTML=
`<div class="card ${topCard.c}">${topCard.v}</div>`;
document.getElementById("botCount").textContent=bot.length;
}

function checkWin(){
if(player.length===0){
alert("🎉 KAMU MENANG!");
startGame();
}
if(bot.length===0){
alert("🤖 BOT MENANG!");
startGame();
}
}

function showInfo(t){
const i=document.getElementById("info");
i.textContent=t;
setTimeout(()=>i.textContent="",1200);
}

startGame();
</script>

</body>
</html>
