<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alter Ego MLBB Line Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:#fff;
    overflow-x:hidden;
}

/* HEADER */
header{
    text-align:center;
    padding:100px 20px;
}

header h1{
    font-size:3.5rem;
    letter-spacing:4px;
    color:#c77dff;
    text-shadow:0 0 20px rgba(199,125,255,.6);
}

header p{
    margin-top:15px;
    opacity:.85;
    font-size:1.1rem;
}

/* SECTION */
section{
    max-width:1100px;
    margin:auto;
    padding:60px 20px;
}

/* GRID PLAYER */
.lineup{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:40px;
}

/* PLAYER CARD */
.player{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(8px);
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    transition:.5s ease;
}

.player:hover{
    transform:translateY(-12px) scale(1.05);
    box-shadow:0 0 30px rgba(199,125,255,.5);
}

/* IMAGE */
.player img{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:50%;
    border:4px solid #c77dff;
    margin-bottom:15px;
    transition:.5s;
}

.player:hover img{
    transform:scale(1.1);
    box-shadow:0 0 20px rgba(199,125,255,.8);
}

/* TEXT */
.player h3{
    font-size:1.3rem;
    margin-bottom:5px;
    color:#e0aaff;
}

.player span{
    font-size:.9rem;
    opacity:.8;
}

/* FOOTER */
footer{
    text-align:center;
    padding:30px;
    font-size:.9rem;
    background:rgba(0,0,0,.3);
    margin-top:60px;
}
</style>
</head>
<body>

<header>
    <h1>ALTER EGO MLBB</h1>
    <p>Official Line Up Mobile Legends: Bang Bang</p>
</header>

<section>
    <div class="lineup">

        <div class="player">
            <img src="img/celiboy.jpg" alt="Celiboy">
            <h3>Celiboy</h3>
            <span>Gold Lane</span>
        </div>

        <div class="player">
            <img src="img/pai.jpg" alt="Pai">
            <h3>Pai</h3>
            <span>Roamer</span>
        </div>

        <div class="player">
            <img src="img/lemon.jpg" alt="Lemon">
            <h3>Lemon</h3>
            <span>EXP Lane</span>
        </div>

        <div class="player">
            <img src="img/rasy.jpg" alt="Rasy">
            <h3>Rasy</h3>
            <span>Mid Lane</span>
        </div>

        <div class="player">
            <img src="img/dreams.jpg" alt="Dreams">
            <h3>Dreams</h3>
            <span>Jungler</span>
        </div>

    </div>
</section>

<footer>
    © 2026 | Alter Ego MLBB – Aesthetic Line Up
</footer>

</body>
</html>
