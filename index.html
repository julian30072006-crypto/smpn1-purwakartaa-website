<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gem UNO Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
    color:#f9c74f;
}

.game{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    width:60px;
    height:90px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    margin:6px;
    cursor:pointer;
    color:white;
    box-shadow:0 4px 10px rgba(0,0,0,.5);
}

.red{background:#e63946;}
.blue{background:#457b9d;}
.green{background:#2a9d8f;}
.yellow{background:#f4a261;color:black;}

.deck{
    margin:20px;
    padding:15px;
    border:2px dashed #fff;
    display:inline-block;
    cursor:pointer;
}

.bot, .player{
    margin-top:20px;
}

.bot .card{
    background:#444;
    cursor:default;
}

.info{
    margin-top:15px;
    font-size:18px;
}
</style>
</head>
<body>

<h1>🎴 GEM UNO GAME</h1>

<div class="game">

    <div class="bot">
        <h3>Bot Cards: <span id="botCount"></span></h3>
    </div>

    <h3>Top Card</h3>
    <div id="topCard"></div>

    <div class="deck" onclick="drawCard()">
        Draw Card
    </div>

    <div class="player">
        <h3>Your Cards</h3>
        <div id="playerCards"></div>
    </div>

    <div class="info" id="info"></div>

</div>

<script>
const colors = ["red","blue","green","yellow"];
let deck = [];
let player = [];
let bot = [];
let topCard = null;
let turn = "player";

function createDeck(){
    deck = [];
    colors.forEach(c=>{
        for(let i=0;i<=9;i++){
            deck.push({color:c, value:i});
            deck.push({color:c, value:i});
        }
    });
}

function shuffle(arr){
    return arr.sort(()=>Math.random()-0.5);
}

function startGame(){
    createDeck();
    shuffle(deck);
    player = deck.splice(0,7);
    bot = deck.splice(0,7);
    topCard = deck.pop();
    updateUI();
}

function drawCard(){
    if(turn !== "player") return;
    player.push(deck.pop());
    turn = "bot";
    updateUI();
    setTimeout(botPlay,1000);
}

function playCard(index){
    const card = player[index];
    if(card.color === topCard.color || card.value === topCard.value){
        topCard = card;
        player.splice(index,1);
        turn = "bot";
        updateUI();
        checkWin();
        setTimeout(botPlay,1000);
    }else{
        info("Kartu tidak cocok!");
    }
}

function botPlay(){
    let played = false;
    for(let i=0;i<bot.length;i++){
        if(bot[i].color === topCard.color || bot[i].value === topCard.value){
            topCard = bot[i];
            bot.splice(i,1);
            played = true;
            break;
        }
    }
    if(!played) bot.push(deck.pop());
    turn = "player";
    updateUI();
    checkWin();
}

function updateUI(){
    const playerDiv = document.getElementById("playerCards");
    playerDiv.innerHTML="";
    player.forEach((c,i)=>{
        const div=document.createElement("div");
        div.className=`card ${c.color}`;
        div.innerText=c.value;
        div.onclick=()=>playCard(i);
        playerDiv.appendChild(div);
    });

    document.getElementById("topCard").innerHTML=
        `<div class="card ${topCard.color}">${topCard.value}</div>`;

    document.getElementById("botCount").innerText=bot.length;
}

function checkWin(){
    if(player.length===0){
        alert("🎉 KAMU MENANG!");
        startGame();
    }
    if(bot.length===0){
        alert("😢 BOT MENANG!");
        startGame();
    }
}

function info(msg){
    document.getElementById("info").innerText=msg;
    setTimeout(()=>document.getElementById("info").innerText="",1500);
}

startGame();
</script>

</body>
</html>
